<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herramientas del albañil</title>
<style>

:root { --page:#faf7f2; --card:#ffffff; --ink:#2b2620; --ink2:#6b6353; --line:#e8e0d2; --accent:#6b4f1d; --warn-bg:#fdf3e3; --warn-line:#d99a2b; --note-bg:#eef5ee; --note-line:#7ba05b; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--page); color: var(--ink); font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 16px; line-height: 1.55; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
.cab { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.cab { flex-direction: column; align-items: flex-start; gap: 10px; }
.cab img { width: 105px; height: auto; max-width: 40%; }
.home .cab img { width: 250px; max-width: 80%; }
.cab h1 { font-size: 24px; margin: 0; line-height: 1.2; }
.fact { color: var(--ink2); font-size: 13px; margin-top: 2px; }
.intro { color: var(--ink2); margin: 10px 0 18px; }
.callout { border-radius: 12px; padding: 12px 16px; margin: 14px 0; font-size: 14.5px; }
.callout b { display: block; margin-bottom: 2px; }
.note { background: var(--note-bg); border: 2px solid var(--note-line); }
.warn { background: var(--warn-bg); border: 2px solid var(--warn-line); }
.seccion { margin-top: 22px; }
.seccion > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin: 0 0 10px; font-weight: 600; }
.datos { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.datos div { display: flex; gap: 10px; padding: 4px 0; }
.datos b { flex: none; min-width: 110px; color: var(--accent); font-size: 14px; }
input[type=search] { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
.niveles { display: flex; gap: 8px; margin-top: 10px; }
.niveles button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font-size: 14.5px; cursor: pointer; }
.niveles button.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.ficha-card { display: block; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
.ficha-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.ficha-card-body { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px 16px; }
.ficha-num { flex: none; font-weight: 700; color: var(--accent); font-size: 18px; }
.ficha-title { font-weight: 600; font-size: 16.5px; }
.ficha-meta { margin-top: 2px; color: var(--ink2); font-size: 12.5px; }
.vacio { color: var(--ink2); font-size: 14.5px; padding: 8px 2px; }
.paso { margin-bottom: 26px; }
.paso img { display: block; width: 100%; border-radius: 16px; border: 1px solid var(--line); }
.paso-pie { display: flex; gap: 12px; align-items: baseline; margin: 12px 0 10px; }
.paso-num { flex: none; font-weight: 700; color: var(--accent); }
.paso-pie p { margin: 0; }
.btn-hecho { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font-size: 14.5px; cursor: pointer; }
.btn-hecho.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.caption { color: var(--ink2); font-size: 12.5px; margin-top: 8px; }
.volver { display: inline-block; margin-top: 10px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-size: 14.5px; }
.pie { margin-top: 30px; color: var(--ink2); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chips button { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font-size: 14px; cursor: pointer; }
.chips button.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid .ficha-card { margin: 0; }
.grid .ficha-card-body { padding: 10px 12px 12px; flex-direction: column; gap: 2px; }
.grid .ficha-title { font-size: 16px; }
.ya { color: #4d7a2e; font-weight: 600; font-size: 12.5px; }
.tambien { color: var(--ink2); margin: 4px 0 14px; }
.uso { font-size: 18px; margin: 10px 0 14px; }
.big img { display: block; width: 100%; border-radius: 16px; border: 1px solid var(--line); }

.visual { display: block; position: relative; overflow: hidden; }
.con-marca::after { content: ''; position: absolute; left: 2.5%; bottom: 3%; width: 8.5%; max-width: 85px; aspect-ratio: 82 / 83; background: url('img/marca.png') center / contain no-repeat; pointer-events: none; }
fieldset{border:0;padding:0;margin:22px 0}legend{font-weight:600;font-size:18px;margin-bottom:12px}.opcion{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}.opcion input{margin-top:6px;accent-color:var(--accent);flex:none}.principal{background:var(--accent);color:white}.ej-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;text-decoration:none;color:var(--ink)}.ej-card .ya{flex:none}.ej-nav{display:flex;justify-content:space-between;gap:12px}.practica p,.datos p{margin:6px 0}progress{width:100%;accent-color:var(--accent)}button,a,input{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9b6d1c;outline-offset:3px}.volver{max-width:100%}

.big img{display:block;width:100%;border-radius:16px;border:1px solid var(--line)}.ej-card .ya{color:#4d7a2e;font-size:13px}.ej-card{flex-wrap:wrap}

</style>
</head>

<script>
const TOOLS = [{"slug": "flexometro", "nombre": "Flexómetro", "cat": "medir", "tambien": "", "uso": "Medir longitudes. La cinta metálica se guarda enrollada dentro de una caja.", "seg": "Suelta la cinta despacio: al recogerse sola puede cortar o dar un golpe.", "ojo": "", "url": "https://www.bellota.com/es-es/producto/flexometro-cromado-para-trabajos-de-medicion-50016/"}, {"slug": "nivel", "nombre": "Nivel de burbuja", "cat": "medir", "tambien": "", "uso": "Comprobar que una superficie está horizontal o vertical. La burbuja debe quedar entre las dos rayas.", "seg": "", "ojo": "", "url": "https://www.comercturro.com/tiendaonline/nivelacion/niveles/"}, {"slug": "plomada", "nombre": "Plomada", "cat": "medir", "tambien": "", "uso": "Una pesa colgada de una cuerda. Marca la línea vertical.", "seg": "No te pongas debajo cuando la cuelgas en altura.", "ojo": "", "url": "https://www.comercturro.com/tiendaonline/marcacion-y-trazado/plomadas/"}, {"slug": "escuadra", "nombre": "Escuadra de acero", "cat": "medir", "tambien": "Escuadra de albañil o de carpintero", "uso": "Dos brazos de acero en ángulo recto. Sirve para marcar y comprobar esquinas de 90 grados.", "seg": "", "ojo": "No es la escuadra de plástico triangular de dibujo.", "url": "https://www.bellota.com/es-es/producto/escuadra-de-acero-inoxidable-para-trabajos-de-medicion-y-marcaje-50215/"}, {"slug": "regla", "nombre": "Regla de albañil", "cat": "medir", "tambien": "Regle, regla de aluminio", "uso": "Listón recto y largo que permite comprobar la planeidad y reglear mortero.", "ojo": "No es un nivel: una regla sin burbuja no comprueba por sí sola la horizontalidad.", "seg": "Manipúlala sin golpear a otras personas.", "url": "https://www.altrad.es/miras-y-reglas", "imagen": "regla.webp", "marca": true}, {"slug": "cordel", "nombre": "Cordel de albañil", "cat": "medir", "tambien": "Hilo de albañil, cuerda de replanteo", "uso": "Hilo que se tensa entre dos puntos para alinear hiladas y marcar referencias.", "ojo": "Alinea una dirección; no sustituye al nivel ni a la plomada.", "seg": "Recoge el hilo para evitar tropiezos.", "url": "https://mahecon.com/product/cordel-de-albanil/", "imagen": "cordel.webp", "marca": true}, {"slug": "tiralineas", "nombre": "Tiralíneas", "cat": "medir", "tambien": "Bota de marcar, marcador de cordel", "uso": "Cuerda con polvo trazador que deja una línea recta al tensarla y soltarla sobre una superficie.", "ojo": "No es un flexómetro: marca líneas, no mide longitudes.", "seg": "Evita levantar polvo hacia la cara.", "url": "https://www.bellota.com/es-es/producto/tiralineas-con-carcasa-de-aluminio-para-trabajos-de-marcaje-50220/", "imagen": "tiralineas.webp", "marca": true}, {"slug": "lapiz", "nombre": "Lápiz de carpintero", "cat": "medir", "tambien": "Lápiz de obra", "uso": "Lápiz plano de mina gruesa para marcar medidas y líneas sobre materiales compatibles.", "ojo": "La marca debe poder verse sobre el material que se va a trabajar.", "seg": "Afílalo con el útil adecuado y corta alejándote del cuerpo.", "url": "https://www.bellota.com/es-es/producto/lapiz-carpintero-para-trabajos-de-marcaje-en-madera-seca-50240/", "imagen": "lapiz.webp", "marca": true}, {"slug": "nivel_laser", "nombre": "Nivel láser", "cat": "medir", "tambien": "Láser de líneas", "uso": "Proyecta líneas de referencia para alinear y nivelar elementos según el equipo.", "ojo": "No mide distancias: un medidor láser es otro instrumento.", "seg": "No mires el haz ni lo dirijas hacia los ojos; sigue el manual del equipo.", "url": "https://www.bosch-professional.com/es/es/products/gll-20-22-g-0601065600", "imagen": "nivel_laser.webp", "marca": true}, {"slug": "martillo", "nombre": "Martillo de carpintero", "cat": "golpear", "tambien": "Martillo de uña", "uso": "Golpear clavos y arrancarlos con la uña.", "seg": "Gafas de protección. No lo uses con el mango roto o la cabeza floja.", "ojo": "No es la maceta ni la piqueta: tienen otra forma y otro uso.", "url": "https://www.bellota.com/es-es/producto/martillo-carpintero-con-mango-de-madera-8007/"}, {"slug": "maceta", "nombre": "Maceta de albañil", "cat": "golpear", "tambien": "", "uso": "Martillo de mango corto con dos caras de golpeo. Se usa para golpear cortafríos, punteros y cinceles.", "seg": "Gafas de protección. Golpea siempre de frente a la cabeza de la herramienta.", "ojo": "Aquí «maceta» es una herramienta, no el recipiente para plantas.", "url": "https://www.pronorsl.es/es/martillos/8021-maceta-alba-il-5308-a-n-bellota-8414299353143.html"}, {"slug": "mazo", "nombre": "Mazo de goma", "cat": "golpear", "tambien": "Maza de goma", "uso": "Dar golpes amortiguados, por ejemplo al colocar baldosas. Reduce las marcas, pero un golpe excesivo también puede romper la pieza.", "seg": "Gafas de protección. No lo uses si la cabeza está suelta.", "ojo": "No sirve para cortar ni para clavar.", "url": "https://www.ferreteriaeltornillo.es/ferreteria/construccion/maza-goma.html"}, {"slug": "piqueta", "nombre": "Piqueta de albañil", "cat": "golpear", "tambien": "Alcotana pala-martillo (según fabricantes)", "uso": "Martillo de albañil con mango de madera: una cara plana para golpear y una pala plana para picar paredes y revocos.", "seg": "Gafas de protección: saltan trocitos de material.", "ojo": "No es el pico: el pico es más grande y sirve para cavar.", "url": "https://www.bellota.com/es-es/producto/piqueta-o-alcotana-pala-martillo-con-mango-de-madera-para-picado-de-paredes-5931/"}, {"slug": "cortafrio", "nombre": "Cortafrío", "cat": "golpear", "tambien": "", "uso": "Cincel fuerte, de filo ancho. Se golpea con la maceta para cortar o abrir roza en frío, sin calor.", "seg": "Gafas de protección. Si la cabeza tiene rebabas, díselo a tu docente.", "ojo": "Es más ancho que el puntero. El filo es plano, no acabado en punta.", "url": "https://www.bellota.com/es-es/para-la-construccion/albanileria-y-placa/cinceles-punteros-y-cortafrios/"}, {"slug": "puntero", "nombre": "Puntero", "cat": "golpear", "tambien": "", "uso": "Barra de acero acabada en punta. Se golpea con la maceta para romper material duro o hacer agujeros.", "seg": "Gafas de protección.", "ojo": "No es un cortafrío: el puntero acaba en punta, el cortafrío tiene filo plano.", "url": "https://www.bellota.com/es-es/para-la-construccion/albanileria-y-placa/cinceles-punteros-y-cortafrios/"}, {"slug": "cincel", "nombre": "Cincel", "cat": "golpear", "tambien": "", "uso": "Barra de acero con filo estrecho. Se golpea con la maceta o el martillo para labrar o abrir ranuras.", "seg": "Gafas de protección.", "ojo": "Hay cinceles de distintos anchos y formas. Elige el adecuado al material y a la tarea, según tu docente.", "url": "https://www.bellota.com/es-es/para-la-construccion/albanileria-y-placa/cinceles-punteros-y-cortafrios/"}, {"slug": "paleta", "nombre": "Paleta", "cat": "extender", "tambien": "Paleta de albañil", "uso": "Hoja de acero triangular con mango. Sirve para coger y extender el mortero.", "seg": "", "ojo": "Es distinta de la llana (plana y rectangular).", "url": "https://www.comercturro.com/tiendaonline/herramienta-manual2/paletas/bellota/"}, {"slug": "llana", "nombre": "Llana", "cat": "extender", "tambien": "", "uso": "Plancha de metal rectangular con asa. Se usa para extender y alisar yeso o mortero.", "seg": "", "ojo": "Paleta (triangular) y llana (rectangular) son herramientas distintas.", "url": "https://www.bellota.com/es-es/para-la-construccion/albanileria-y-placa/llanas-talochas-y-espatulas/"}, {"slug": "llana_dentada", "nombre": "Llana dentada", "cat": "extender", "tambien": "Peine", "uso": "Llana con dientes en el borde. Deja el pegamento en surcos para colocar azulejos.", "seg": "", "ojo": "No es la llana lisa. Tiene dientes.", "url": "https://www.comercturro.com/tiendaonline/llanas-peines-y-talochas/llanas-dentadas-peines/"}, {"slug": "fratas", "nombre": "Fratás", "cat": "extender", "tambien": "Talocha", "uso": "Herramienta con asa y base para igualar y dar acabado al mortero. El resultado depende del material de la base y del momento de uso.", "seg": "", "ojo": "Se parece a la llana, pero la base es de madera, plástico o esponja, no de metal.", "url": "https://www.comercturro.com/tiendaonline/llanas-peines-y-talochas/talochas-fratas/"}, {"slug": "espatula", "nombre": "Espátula", "cat": "extender", "tambien": "", "uso": "Hoja metálica ancha y flexible con mango. Sirve para rascar y para alisar o extender masilla o yeso en poca cantidad.", "seg": "Lleva el filo hacia fuera de ti al rascar.", "ojo": "Es más pequeña y flexible que la paleta.", "url": "https://www.bellota.com/es-es/producto/espatula-de-acero-inoxidable-con-mango-de-madera-para-trabajos-de-acabado-5893/"}, {"slug": "paletin", "nombre": "Paletín", "cat": "extender", "tambien": "Paleta pequeña", "uso": "Hoja pequeña con mango para aplicar mortero y rematar rincones o zonas estrechas.", "ojo": "Es más pequeño que la paleta; no es una espátula flexible.", "seg": "Mantén la mano alejada del borde de la hoja.", "url": "https://www.bellota.com/es-es/para-la-construccion/albanileria-y-placa/paletas-y-paletines/", "imagen": "paletin.webp", "marca": true}, {"slug": "llana_goma", "nombre": "Llana de goma para juntas", "cat": "extender", "tambien": "Llana de rejuntar", "uso": "Base de goma con asa para extender mortero de juntas entre baldosas.", "ojo": "No es una llana dentada: rellena juntas y retira el exceso del producto.", "seg": "Usa la protección indicada en la ficha de seguridad del mortero.", "url": "https://www.rubi.com/es/producto/llanas-de-goma-para-juntas-superpro-mango-plastico", "imagen": "llana_goma.webp", "marca": true}, {"slug": "esponja", "nombre": "Esponja de albañil", "cat": "extender", "tambien": "Esponja de rejuntado", "uso": "Esponja de poro fino para limpiar restos de rejuntado en el momento indicado por el producto.", "ojo": "No es un estropajo abrasivo: debe ser compatible con la superficie.", "seg": "Evita el contacto con productos irritantes y sigue su ficha de seguridad.", "url": "https://www.rubi.com/es/producto/esponjas-pro", "imagen": "esponja.webp", "marca": true}, {"slug": "pistola_silicona", "nombre": "Pistola para cartuchos", "cat": "extender", "tambien": "Pistola de silicona, aplicador de sellador", "uso": "Empuja el émbolo de un cartucho para aplicar sellador o adhesivo en un cordón.", "ojo": "Es un aplicador; el producto del cartucho puede ser silicona u otro sellador.", "seg": "Descarga la presión al terminar y sigue la etiqueta del producto.", "url": "https://www.bellota.com/es-es/producto/pistola-silicona-50262/", "imagen": "pistola_silicona.webp", "marca": true}, {"slug": "cuezo", "nombre": "Gaveta", "cat": "mezclar", "tambien": "Cuezo", "uso": "Recipiente bajo y ancho, de goma, para amasar o tener mortero y yeso.", "seg": "", "ojo": "No es el cubo: la gaveta es ancha y poco profunda.", "url": "https://es.wikipedia.org/wiki/Gaveta_(alba%C3%B1iler%C3%ADa)"}, {"slug": "capazo", "nombre": "Capazo", "cat": "mezclar", "tambien": "Espuerta", "uso": "Cesto con dos asas para llevar arena, escombro o mortero. Hoy suele ser de goma o plástico.", "seg": "Carga lo que puedas levantar sin torcer la espalda.", "ojo": "No es el cubo: el capazo tiene dos asas.", "url": "https://www.comercturro.com/tiendaonline/capazos-espuertas-gavetas-para-obra/"}, {"slug": "cubo", "nombre": "Cubo de albañil", "cat": "mezclar", "tambien": "", "uso": "Recipiente con asa para llevar agua o materiales.", "seg": "No lo llenes más de lo que puedes cargar.", "ojo": "", "url": "https://www.obramat.es/herramientas/herramientas-de-albanil/cubos-capazos-y-espuertas/"}, {"slug": "pala", "nombre": "Pala", "cat": "mezclar", "tambien": "", "uso": "Hoja de acero con mango largo. Sirve para mover y mezclar arena, cemento y mortero.", "seg": "Cuando cargues, dobla las rodillas y no la gires con la espalda.", "ojo": "", "url": "https://www.bellota.com/es-es/para-la-construccion/albanileria-y-placa/palas-de-construccion/"}, {"slug": "pico", "nombre": "Pico", "cat": "mezclar", "tambien": "", "uso": "Barra de acero con dos extremos y mango de madera. Sirve para cavar y romper tierra dura.", "seg": "Gafas y botas de seguridad. Mantén espacio libre alrededor.", "ojo": "No es la piqueta de albañil: el pico es más grande.", "url": "https://www.ferreteriapalacios.es/herramientas/herramientas-profesional/herramienta-manual/palas-picos/"}, {"slug": "azadon", "nombre": "Azada", "cat": "mezclar", "tambien": "", "uso": "Hoja ancha y plana con mango largo. Se usa para remover y trabajar la tierra.", "seg": "Cuando cargues, dobla las rodillas.", "ojo": "No es la pala: la hoja forma ángulo con el mango.", "url": "https://www.obramat.es/nuestras-marcas/bellota/azada-bellota/"}, {"slug": "carretilla", "nombre": "Carretilla de obra", "cat": "mezclar", "tambien": "Carretilla de mano", "uso": "Recipiente con una rueda, dos mangos y apoyos para transportar materiales.", "ojo": "No es un equipo para transportar personas.", "seg": "Reparte la carga, despeja el recorrido y evita sobrecargarla.", "url": "https://www.altrad.es/carretillas", "imagen": "carretilla.webp", "marca": true}, {"slug": "tenazas", "nombre": "Tenaza de carpintero", "cat": "sujetar", "tambien": "", "uso": "Dos brazos con un eje. Sirve para agarrar y arrancar clavos.", "seg": "Gafas de protección.", "ojo": "Sus bocas curvas facilitan extraer clavos. No es la tenaza de alicatador para recortar cerámica.", "url": "https://www.bellota.com/es-es/producto/tenaza-carpintero-para-trabajos-de-carpinteria-6005/"}, {"slug": "alicates", "nombre": "Alicates universales", "cat": "sujetar", "tambien": "", "uso": "Herramienta articulada con mordazas y zona de corte. Sirve para sujetar piezas pequeñas y doblar o cortar alambre.", "seg": "No los uses como llave ni como martillo. Un mango de plástico no garantiza aislamiento eléctrico.", "ojo": "No es la tenaza de carpintero: fíjate en la forma y en la función de las mordazas.", "url": "https://www.bellota.com/es-es/para-el-taller/herramienta-universal-taller/alicates/ jos.webp", "marca": true}, {"slug": "cutter", "nombre": "Cúter", "cat": "cortar", "tambien": "Cuchilla retráctil", "uso": "Cuchilla de hoja recambiable para cortar materiales compatibles, como cartón o determinados revestimientos.", "ojo": "No se utiliza como destornillador ni como palanca.", "seg": "Saca solo la hoja necesaria, corta alejándote del cuerpo y guárdalo con la hoja recogida.", "url": "https://www.bellota.com/es-es/para-la-construccion/herramienta-universal/herramientas-de-corte/", "imagen": "cutter.webp", "marca": true}, {"slug": "mezclador", "nombre": "Mezclador eléctrico", "cat": "electricas", "tambien": "Batidor de mortero", "uso": "Motor con una varilla que mezcla morteros o adhesivos compatibles en un recipiente.", "ojo": "No es una hormigonera; utiliza la varilla y la capacidad indicadas por el fabricante.", "seg": "Desconecta el equipo antes de cambiar la varilla. Mantén ropa y manos lejos de las partes giratorias.", "url": "https://www.bosch-professional.com/es/es/mezcladoras-101358-ocs-c/", "imagen": "mezclador.webp", "marca": true}, {"slug": "taladro", "nombre": "Taladro percutor", "cat": "electricas", "tambien": "Taladradora", "uso": "Hace agujeros con una broca. La percusión se emplea solo en materiales y tareas compatibles.", "ojo": "No es un martillo perforador; selecciona el modo y la broca adecuados.", "seg": "Comprueba que no haya cables ni tuberías ocultos. Sujeta la pieza y utiliza la protección indicada en el manual.", "url": "https://www.bosch-professional.com/es/es/taladros-con-percusion-101356-ocs-c/", "imagen": "taladro.webp", "marca": true}, {"slug": "amoladora", "nombre": "Amoladora angular", "cat": "electricas", "tambien": "Radial", "uso": "Máquina con disco para cortar o desbastar según el accesorio y el material.", "ojo": "Los discos de corte y desbaste no se usan de la misma forma ni son intercambiables para cualquier tarea.", "seg": "Úsala solo con formación: protector, disco compatible y empuñadura auxiliar. Controla el polvo y las proyecciones según el manual.", "url": "https://www.bosch-professional.com/es/es/products/gws-7-125-0601388108", "imagen": "amoladora.webp", "marca": true}, {"slug": "cepillo_alambre", "nombre": "Cepillo de alambre", "cat": "limpiar", "tambien": "Cepillo metálico", "uso": "Cepillo manual de púas metálicas para retirar óxido y restos adheridos de superficies compatibles.", "ojo": "Puede rayar: comprueba antes que sea adecuado para el soporte.", "seg": "Usa gafas de protección y controla el polvo y las púas sueltas.", "url": "https://www.bellota.com/es-es/para-el-taller/cepillos/cepillos-taller/", "imagen": "cepillo_alambre.webp", "marca": true}];
const CATS = [["medir", "Medir y comprobar"], ["golpear", "Golpear y cortar a golpes"], ["extender", "Extender y alisar"], ["mezclar", "Mezclar, cargar y cavar"], ["sujetar", "Sujetar, apretar y serrar"], ["cortar", "Cortar y ajustar"], ["electricas", "Herramientas eléctricas"], ["limpiar", "Limpiar y preparar"]];
const state = { vista: 'home', slug: null, buscar: '', cat: 'todas', ya: {} };
const app = document.getElementById('app');
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function irTool(s) { state.vista = 'tool'; state.slug = s; window.scrollTo(0, 0); location.hash = '/herramienta/' + s; render(); }
function irHome() { state.vista = 'home'; state.slug = null; location.hash = '/'; render(); }
window.addEventListener('hashchange', () => {
  const em=location.hash.match(/^#\/ejercicios(?:\/([a-z0-9_]+))?$/);
  if(em&&(!em[1]||EJERCICIOS.some(e=>e.slug===em[1]))){state.vista=em[1]?'ejercicio':'ejercicios';state.slug=em[1]||null;window.scrollTo(0,0);render();return;}
  const m = location.hash.match(/#\/herramienta\/([a-z_]+)/);
  if (m && TOOLS.some(t => t.slug === m[1])) { state.vista = 'tool'; state.slug = m[1]; } else { state.vista = 'home'; state.slug = null; }
  render();
});
function head(titulo, fact, intro) {
  return '<div class="cab"><img src="img/logo.png" alt="Logotipo de la Fundación Laboral de la Construcción Castilla-La Mancha"><div><h1>' + esc(titulo) + '</h1><div class="fact">' + esc(fact) + '</div></div></div>' + (intro ? '<p class="intro">' + esc(intro) + '</p>' : '');
}
function renderHome() {
  const q = norm(state.buscar);
  const lista = TOOLS.filter(t => (state.cat === 'todas' || t.cat === state.cat) && (!q || q.split(/\s+/).every(w => norm(t.nombre + ' ' + t.tambien + ' ' + t.uso).includes(w))));
  let h = head('Herramientas del albañil', 'Construcción · vocabulario de España · ' + TOOLS.length + ' herramientas', 'Cada herramienta con su nombre en España, para qué sirve y otros nombres que puedes oír.');
  h += '<div class="seccion"><h2>Buscar y filtrar</h2><input type="search" id="q" aria-label="Buscar herramientas" placeholder="Buscar (también otros nombres)" value="' + esc(state.buscar) + '"><div class="chips">';
  h += '<button data-c="todas" class="' + (state.cat === 'todas' ? 'sel' : '') + '">Todas</button>';
  CATS.forEach(c => { h += '<button data-c="' + c[0] + '" class="' + (state.cat === c[0] ? 'sel' : '') + '">' + esc(c[1]) + '</button>'; });
  h += '</div></div><div class="seccion"><h2>Las herramientas · ' + lista.length + (lista.length === 1 ? ' resultado' : ' resultados') + '</h2>';
  if (!lista.length) h += '<div class="vacio">No hay herramientas con esa búsqueda.</div>';
  h += '<div class="grid">';
  lista.forEach(t => { h += '<a class="ficha-card" href="#/herramienta/' + t.slug + '" data-s="' + t.slug + '"><span class="visual' + (t.marca ? ' con-marca' : '') + '"><img src="img/' + (t.imagen || t.slug + '.jpg') + '" alt="' + esc(t.nombre) + '" loading="lazy" decoding="async"></span><div class="ficha-card-body"><div class="ficha-title">' + esc(t.nombre) + '</div>' + (state.ya[t.slug] ? '<div class="ya">Ya la conozco</div>' : '') + '</div></a>'; });
  h += '</div></div><div class="pie">Los dibujos son orientativos. El uso seguro de cada herramienta lo indica tu docente.</div>';
  app.className = 'wrap home'; app.innerHTML = h;
  const qi = document.getElementById('q'); qi.addEventListener('input', e => { state.buscar = e.target.value; const p = e.target.selectionStart; renderHome(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(p, p); });
  app.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => { state.cat = b.dataset.c; renderHome(); }));
  app.querySelectorAll('.ficha-card').forEach(a => a.addEventListener('click', e => { e.preventDefault(); irTool(a.dataset.s); }));
}
function renderTool() {
  const t = TOOLS.find(x => x.slug === state.slug);
  const cat = CATS.find(c => c[0] === t.cat)[1];
  let h = head(t.nombre, cat, '');
  h += '<div class="big visual' + (t.marca ? ' con-marca' : '') + '"><img src="img/' + (t.imagen || t.slug + '.jpg') + '" alt="' + esc(t.nombre) + '" loading="eager"></div>';
  if (t.tambien) h += '<p class="tambien"><b>También se dice:</b> ' + esc(t.tambien) + '</p>';
  h += '<p class="uso"><b>Para qué sirve:</b> ' + esc(t.uso) + '</p>';
  if (t.ojo) h += '<div class="callout note"><b>No la confundas</b>' + esc(t.ojo) + '</div>';
  if (t.seg) h += '<div class="callout warn"><b>Seguridad</b>' + esc(t.seg) + ' Sigue siempre lo que indique tu docente.</div>';
  h += '<p class="caption">Fuente del nombre (catálogo en España): <a href="' + t.url + '" target="_blank" rel="noopener">' + esc(new URL(t.url).hostname.replace('www.','')) + '</a></p>';
  h += '<button class="btn-hecho ' + (state.ya[t.slug] ? 'sel' : '') + '" id="ya">' + (state.ya[t.slug] ? 'Ya la conozco' : 'Marcar «ya la conozco»') + '</button>';
  h += '<div class="caption">El marcado es una ayuda temporal: dura mientras la página está abierta.</div>';
  h += '<a class="volver" href="#/" id="v">Volver a la lista</a>';
  app.className = 'wrap'; app.innerHTML = h;
  document.getElementById('ya').addEventListener('click', () => { state.ya[t.slug] = !state.ya[t.slug]; renderTool(); });
  document.getElementById('v').addEventListener('click', e => { e.preventDefault(); irHome(); });
}
function render() { if (state.vista === 'tool') renderTool(); else renderHome(); }

</script>
